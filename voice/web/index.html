<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBI Assistant — голосовое демо</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; min-height: 220px; max-height: 380px;
         overflow-y: auto; padding: 12px; margin: 12px 0; background: #fafafa; }
  .u { color: #0b5ed7; margin: 6px 0; } .a { color: #137333; margin: 6px 0; }
  .sys { color: #888; font-size: 0.85em; }
  #dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  #dash div { border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 0.9em; }
  #dash b { display: block; font-size: 0.75em; color: #666; text-transform: uppercase; }
  button { font-size: 1em; padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  #micBtn.live { background: #d93025; color: #fff; }
  input[type=text] { width: 70%; padding: 8px; }
</style>
<h2>DBI Assistant — голосовой администратор клиники</h2>
<div id="dash">
  <div><b>Состояние</b><span id="dState">—</span></div>
  <div><b>Запись</b><span id="dBooking">—</span></div>
  <div><b>Задержка хода</b><span id="dLat">—</span></div>
</div>
<div>
  <input type="text" id="tokenIn" value="demo" size="16" title="Bearer-токен пациента">
  <button id="micBtn">🎤 Говорить (нажми — говори — нажми)</button>
  <button id="stopBtn">⏹ Стоп</button>
</div>
<div id="log"></div>
<div>
  <input type="text" id="textIn" placeholder="Текстовый фолбэк: Хочу записаться к неврологу…">
  <button id="sendBtn">➤</button>
</div>
<p class="sys">STT — GigaAM, TTS — Qwen (серверные, через /voice/transcribe + /voice/speak).
Нажми «Говорить», скажи фразу, нажми ещё раз — дальше всё само. Требует микрофон (localhost/HTTPS).</p>
<script>
const log = document.getElementById("log");
const micBtn = document.getElementById("micBtn");
let audioEl = null;

function token() { return document.getElementById("tokenIn").value.trim(); }
function headers(extra) {
  return Object.assign({"X-Patient-Token": token()}, extra || {});
}
function line(cls, who, text) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = who + text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function sys(t) { line("sys", "", t); }
function stopAudio() { if (audioEl) { try { audioEl.pause(); } catch (_) {} audioEl = null; } }

async function doTurn(text) {
  line("u", "Пациент: ", text);
  const t0 = performance.now();
  const r = await fetch("/dialogue/turn", {
    method: "POST", headers: headers({"Content-Type": "application/json"}),
    body: JSON.stringify({text}),
  });
  if (!r.ok) { sys("Turn: HTTP " + r.status); return; }
  const j = await r.json();
  document.getElementById("dState").textContent = j.flow + " / " + j.phase;
  document.getElementById("dLat").textContent = Math.round(performance.now() - t0) + " мс";
  const bids = (j.trace || []).map(e => e.data && e.data.booking_id).filter(Boolean);
  if (bids.length) document.getElementById("dBooking").textContent = bids[bids.length - 1];
  line("a", "Ассистент: ", j.speech);
  await speak(j.speech);
}

async function speak(text) {
  stopAudio();
  const r = await fetch("/voice/speak", {
    method: "POST", headers: headers({"Content-Type": "application/json"}),
    body: JSON.stringify({text}),
  });
  if (!r.ok) { sys("TTS: HTTP " + r.status); return; }
  audioEl = new Audio(URL.createObjectURL(await r.blob()));
  audioEl.play().catch(e => sys("Play: " + e.message));
}

// ---- push-to-talk PCM capture: mic -> 16k int16 -> /voice/transcribe ----
let actx = null, stream = null, worklet = null, chunks = [], recording = false;
const WORKLET = `class Cap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0] && inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
} registerProcessor('cap', Cap);`;

async function startRec() {
  stopAudio();
  stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true}});
  actx = new (window.AudioContext || window.webkitAudioContext)();
  await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type: "application/javascript"})));
  const src = actx.createMediaStreamSource(stream);
  worklet = new AudioWorkletNode(actx, "cap");
  chunks = [];
  worklet.port.onmessage = (e) => chunks.push(e.data);
  src.connect(worklet);
  recording = true;
  micBtn.classList.add("live"); micBtn.textContent = "● Слушаю… нажми чтобы закончить";
}

async function stopRec() {
  recording = false;
  micBtn.classList.remove("live"); micBtn.textContent = "🎤 Говорить (нажми — говори — нажми)";
  try { worklet && worklet.disconnect(); } catch (_) {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (_) {}
  try { actx && await actx.close(); } catch (_) {}
  actx = worklet = stream = null;
  if (!chunks.length) { sys("Пустая запись."); return; }
  // concat + downsample to 16k + int16
  let total = 0; for (const c of chunks) total += c.length;
  const mixed = new Float32Array(total);
  let off = 0; for (const c of chunks) { mixed.set(c, off); off += c.length; }
  const srcRate = lastRate || 48000;
  const out = downsample(mixed, srcRate, 16000);
  const pcm = new Int16Array(out.length);
  for (let i = 0; i < out.length; i++) {
    const s = Math.max(-1, Math.min(1, out[i]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  sys("Распознаю… (" + (pcm.byteLength / 32000).toFixed(1) + "с аудио)");
  const r = await fetch("/voice/transcribe?sample_rate=16000", {
    method: "POST", headers: headers({"Content-Type": "application/octet-stream"}),
    body: pcm.buffer,
  });
  if (!r.ok) { sys("STT: HTTP " + r.status); return; }
  const j = await r.json();
  if (!j.text) { sys("Ничего не расслышал, повтори."); return; }
  await doTurn(j.text);
}

let lastRate = 48000;
function downsample(buf, fromRate, toRate) {
  if (fromRate === toRate) return buf;
  const ratio = fromRate / toRate;
  const out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++) out[i] = buf[Math.floor(i * ratio)];
  return out;
}

micBtn.onclick = async () => {
  if (recording) { await stopRec(); return; }
  try {
    await startRec();
    lastRate = (actx && actx.sampleRate) || 48000;
  } catch (e) { sys("Mic: " + e.message); }
};
document.getElementById("stopBtn").onclick = () => { stopAudio(); };
document.getElementById("sendBtn").onclick = async () => {
  const t = document.getElementById("textIn").value.trim();
  if (!t) return;
  document.getElementById("textIn").value = "";
  await doTurn(t);
};
</script>
</html>
