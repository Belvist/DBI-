name: CI

on:
  push:
    branches:
      - main
      - "audit/**"
      - "feature/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dbi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --interval=5s --timeout=3s --retries=10
    env:
      DBI_PG_URL: postgresql://postgres:postgres@localhost:5432/dbi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: >-
          python -m ruff check domain clinic_adapter nlu dialogue api voice
          observability demo tests identity sessions

      - name: Unit tests (incl. Postgres parity)
        run: PYTHONPATH=. python -m pytest tests/ -q

      - name: Scenario eval
        run: PYTHONPATH=. python -m demo.eval
