name: CI

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check domain clinic_adapter nlu dialogue api voice observability demo tests

      - name: Unit tests
        run: PYTHONPATH=. python -m pytest tests/ -q

      - name: Scenario eval
        run: PYTHONPATH=. python -m demo.eval
