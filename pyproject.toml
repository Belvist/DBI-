[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dbi-assistant"
version = "0.1.0"
description = "DBI voice clinic administrator — deterministic booking core, voice is a thin layer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.1",
  "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "clinic_adapter*",
  "config*",
  "demo*",
  "dialogue*",
  "domain*",
  "identity*",
  "nlu*",
  "observability*",
  "resilience*",
  "sessions*",
  "voice*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
clinic_adapter = ["migrations/*.sql"]
voice = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Naive wall-time datetimes are intentional (hackathon scope, Europe/Moscow);
# tz conversion lives in the DBI adapter, never in domain logic.
ignore = ["DTZ001", "DTZ005", "DTZ007", "BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
